<div class="project-grid">
  {{ range .Site.RegularPages.ByDate.Reverse }}
    {{ if eq (lower .Section) "project" }}
      <article class="project-card" data-reveal>
        <div class="project-meta"><span>Project</span><span>{{ .Date.Format "2006" }}</span></div>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <a class="text-link" href="{{ .RelPermalink }}" aria-label="Read project: {{ .Title }}"
          >Read project <span aria-hidden="true">↗</span></a
        >
      </article>
    {{ end }}
  {{ end }}
</div>
